<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academic Coordinator Portal – Smart Mission High School</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{--red:#c4121f;--bg:#f5f2ee;--card:#fff;--ink:#1b1b1f;--mute:#5f5f66;--line:#ddd6cc;--soft:#fbeaec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1f1f23;--ink:#f1efec;--mute:#a9a7a3;--line:#37373d;--soft:#3a1a1d}}
:root[data-theme="dark"]{--bg:#141416;--card:#1f1f23;--ink:#f1efec;--mute:#a9a7a3;--line:#37373d;--soft:#3a1a1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font-family:Poppins,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--red);z-index:10}
header{background:var(--red);color:#fff;padding:18px 16px 14px}
header h1{font-size:19px;font-weight:800}header p{font-size:12px;opacity:.9}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;border:2px solid var(--red);background:transparent;color:var(--red);font:600 14px Poppins,Arial,sans-serif;padding:10px;border-radius:12px;cursor:pointer}
.tab.on{background:var(--red);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;font-weight:700;color:var(--red);margin-bottom:2px}
.card .sub{font-size:12px;color:var(--mute);margin-bottom:4px}
label{display:block;font-weight:600;font-size:12px;margin:12px 0 4px}
input,select,textarea{width:100%;font:400 14px Poppins,Arial,sans-serif;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:74px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radios{display:flex;gap:8px}
.radios label,.chk label{margin:0;border:2px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:600;cursor:pointer;text-align:center}
.radios label{flex:1}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{border-width:1px;border-radius:20px;padding:6px 12px;font-weight:500;font-size:12px}
.radios input,.chk input{display:none}
.radios label.on,.chk label.on{border-color:var(--red);background:var(--soft);color:var(--red)}
.chk label,.radios label{-webkit-tap-highlight-color:transparent;user-select:none}
a.btn{display:block;text-align:center;text-decoration:none}
.codebox{font-size:11px;min-height:90px;word-break:break-all}
.hint{font-size:11px;color:var(--mute);margin-top:3px}
.srow{border:1px dashed var(--line);border-radius:10px;padding:8px;margin-top:8px}
.btn{background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:700 15px Poppins,Arial,sans-serif;cursor:pointer;width:100%;margin-top:12px}
.btn.s{width:auto;padding:8px 14px;font-size:13px;margin-top:8px}
.btn.o{background:transparent;color:var(--red);border:2px solid var(--red)}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-weight:600}
.ok{background:#e4f4e8;color:#14532d}.er{background:var(--soft);color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:21px;color:var(--red);font-weight:800}.stat span{font-size:11px;color:var(--mute)}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 10px;background:var(--soft);color:var(--red)}
.meta{font-size:12px;color:var(--mute)}.concl{font-weight:600;margin:6px 0}.stu{font-size:12px;margin-top:4px}
.ctl{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:8px}
.empty{text-align:center;color:var(--mute);padding:26px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}.hav{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #fff;flex:none}.me{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--red);flex:none}.intro{display:flex;gap:12px;align-items:center}.hide{display:none}
details{margin-top:8px;font-size:12px}summary{cursor:pointer;color:var(--red);font-weight:600}
.qa{margin-top:6px}.qa b{display:block;color:var(--mute);font-weight:500}
.rp{background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:12px}.rp b{color:var(--red)}.ra{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

 else{c=h('div',{class:'chk'},f.o.map(o=>h('label',{},h('input',{type:'checkbox',value:o}),o)));G[f.id]=()=>[...c.querySelectorAll('input:checked')].map(x=>x.value);sync(c)}
